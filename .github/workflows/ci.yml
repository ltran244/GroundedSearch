name: CI

on:
  push:
  pull_request:

env:
  # Settings requires these, even for tests that never connect. No API keys:
  # the suite is expected to run without them, and the live test is excluded by
  # `addopts = ["-m", "not live"]` in pyproject.toml.
  DATABASE_HOST: localhost
  DATABASE_PORT: 5432
  DATABASE_NAME: groundedsearch
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  TEST_DATABASE_NAME: groundedsearch_test
  REDIS_HOST: localhost
  REDIS_PORT: 6379

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make check
      # No database or network needed; outbound connections are blocked.
      - run: make test-unit

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose, so pgvector is available.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: groundedsearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # The fixtures apply migrations, but the database itself must exist first.
      - name: Create the test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE $TEST_DATABASE_NAME"
        env:
          PGPASSWORD: postgres
      - run: make test-integration
